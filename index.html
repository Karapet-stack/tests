<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тестування</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px}
header{text-align:center;margin-bottom:34px}
header h1{margin:0 0 8px;font-size:26px;font-weight:700}
header p{margin:0;color:#6b7280;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px 16px;text-align:center;text-decoration:none;color:inherit;transition:.15s}
.card.ready:hover{border-color:#2563eb;box-shadow:0 6px 18px rgba(37,99,235,.10);transform:translateY(-2px)}
.icon{width:64px;height:64px;margin:0 auto 14px;border-radius:14px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.icon.empty{background:transparent;border:2px dashed #d1d5db}
.icon img{width:100%;height:100%;object-fit:cover}
.title{font-size:16px;font-weight:700;line-height:1.3;margin-bottom:6px;min-height:42px;display:flex;align-items:center;justify-content:center}
.desc{font-size:13px;color:#6b7280;line-height:1.4;margin-bottom:12px;min-height:36px}
.meta{margin-top:auto;font-size:13px;color:#4b5563;padding-top:12px;border-top:1px solid #f0f1f3}
.btn{margin-top:12px;background:#2563eb;color:#fff;border-radius:8px;padding:10px;font-size:14px;font-weight:700}
.card.soon{background:#fafafa;cursor:default}
.card.soon .title{color:#9ca3af}
.soon-label{margin-top:auto;font-size:13px;color:#9ca3af;padding-top:12px;border-top:1px solid #f0f1f3}
.missing{margin-top:8px;font-size:12px;color:#b91c1c}
footer{text-align:center;margin-top:34px}
footer a{color:#6b7280;font-size:14px;text-decoration:none;border-bottom:1px solid #d1d5db}
footer a:hover{color:#111827}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тестування</h1>
    <p>Оберіть предмет. Потрібні код здобувача, ПІБ та група.</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer><a href="panel-vykladacha.html">Панель викладача</a></footer>
</div>

<script>
/* ============================================================
   СПИСОК ПРЕДМЕТІВ — редагуйте тут
   ready:true  — тест готовий (потрібні url, questions, minutes, attempts)
   ready:false — на картці буде «Тест готується»
   icon: ""            — порожня іконка-рамка (заповните пізніше)
         "📐"          — емодзі
         "img/web.png" — картинка (шлях до файлу)
   url — ТОЧНА назва файлу тесту поруч із цією сторінкою
============================================================ */
const SUBJECTS = [
  { ready:true,  icon:"💻", title:"Засоби комп’ютерних інформаційних систем", desc:"Будова та принцип роботи ПК, пристрої, ОС і файли, захист даних", questions:60, minutes:30, attempts:3, url:"kcis.html" },
  { ready:true,  icon:"🌐", title:"Комп’ютерні мережі", desc:"Протоколи, адреси, обладнання, Wi-Fi, DNS", questions:50, minutes:30, attempts:3, url:"km.html" },
  { ready:true,  icon:"📐", title:"Креслення", desc:"Лінії, розміри, види, розрізи, масштаби", questions:32, minutes:30, attempts:3, url:"kreslennia.html" },
  { ready:true,  icon:"🖥️", title:"Інформаційні технології", desc:"Інформація, ОС і файли, Word, Excel, презентації, Інтернет, безпека", questions:20, minutes:20, attempts:3, url:"test-it.html" },
   { ready:true,  icon:"🪟", title:"Операційні системи", desc:"Призначення ОС, інтерфейс, файли й папки, диски, процеси, налаштування, безпека", questions:25, minutes:25, attempts:3, url:"test-os.html" },
  { ready:false, icon:"", title:"Веб-дизайн" },
  { ready:false, icon:"", title:"Інженерна графіка" },
  { ready:false, icon:"", title:"САПР" },
  { ready:false, icon:"", title:"Комп’ютерна графіка" },
  { ready:false, icon:"", title:"Бази даних" },
  { ready:false, icon:"", title:"Комп’ютерні системи" },
  { ready:false, icon:"", title:"Вебтехнології" }
];

function makeIcon(icon){
  const d = document.createElement("div");
  d.className = "icon";
  if(!icon){ d.classList.add("empty"); return d; }
  if(/[\/.]/.test(icon)){
    const img = document.createElement("img"); img.src = icon; img.alt = "";
    img.onerror = () => { d.textContent = ""; d.classList.add("empty"); img.remove(); };
    d.appendChild(img);
  }else d.textContent = icon;
  return d;
}
function div(cls, text){ const e = document.createElement("div"); e.className = cls; if(text) e.textContent = text; return e; }

const grid = document.getElementById("grid");
SUBJECTS.forEach(s => {
  if(s.ready){
    const a = document.createElement("a");
    a.className = "card ready"; a.href = s.url;
    a.append(makeIcon(s.icon), div("title", s.title), div("desc", s.desc || ""),
             div("meta", s.questions + " питань · " + s.minutes + " хв · " + s.attempts + " спроби"),
             div("btn", "Розпочати"));
    grid.appendChild(a);

    // перевірка, чи існує файл тесту (працює на хостингу; локально з file:// мовчки пропускається)
    if(location.protocol.startsWith("http")){
      fetch(s.url, { method: "HEAD", cache: "no-store" }).then(r => {
        if(!r.ok){ a.append(div("missing", "Файл не знайдено: " + s.url)); }
      }).catch(() => {});
    }
  }else{
    const c = document.createElement("div");
    c.className = "card soon";
    c.append(makeIcon(s.icon), div("title", s.title), div("desc", ""), div("soon-label", "Тест готується"));
    grid.appendChild(c);
  }
});
</script>
</body>
</html>
